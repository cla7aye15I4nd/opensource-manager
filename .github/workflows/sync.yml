name: Sync managed forks

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    outputs:
      batches: ${{ steps.find.outputs.batches }}
      count: ${{ steps.find.outputs.count }}
    runs-on: ubuntu-latest
    steps:
      - name: Find public open-source forks
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repositories="$(
            gh api --paginate "users/$OWNER/repos?per_page=100&type=owner&sort=full_name" \
              --jq '.[] | select(.fork and (.private | not) and (.name | startswith("opensource-"))) | .name'
          )"

          REPOSITORIES="$repositories" python3 - <<'PYTHON'
          import json
          import os
          repos = os.environ["REPOSITORIES"].splitlines()
          batches = [{"repositories": "\n".join(repos[i:i + 400])}
                     for i in range(0, len(repos), 400)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("batches=" + json.dumps(batches) + "\n")
              output.write("count=" + str(len(repos)) + "\n")
          print(f"Found {len(repos)} forks in {len(batches)} batches")
          PYTHON

  sync:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.batches) }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repositories }}
          permission-contents: write
          permission-workflows: write

      - name: Sync forks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORIES: ${{ matrix.repositories }}
        run: |
          failed=0
          while IFS= read -r repo; do
            echo "Syncing $repo"
            gh repo sync "${{ github.repository_owner }}/$repo" --force || failed=1
          done <<< "$REPOSITORIES"
          exit "$failed"
