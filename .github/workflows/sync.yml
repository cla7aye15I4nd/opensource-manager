name: Sync managed forks

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Find public open-source forks
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repositories="$(
            gh api --paginate "users/$OWNER/repos?per_page=100&type=owner&sort=full_name" \
              --jq '.[] | select(.fork and (.private | not) and (.name | startswith("opensource-"))) | .name'
          )"

          if [[ -z "$repositories" ]]; then
            echo "No matching forks found."
            echo "repositories=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Matching forks:"
          echo "$repositories"
          {
            echo "repositories<<EOF"
            echo "$repositories"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: steps.find.outputs.repositories != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.find.outputs.repositories }}
          permission-contents: write
          permission-workflows: write

      - name: Sync forks
        if: steps.find.outputs.repositories != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORIES: ${{ steps.find.outputs.repositories }}
        run: |
          failed=0
          while IFS= read -r repo; do
            gh repo sync "${{ github.repository_owner }}/$repo" || failed=1
          done <<< "$REPOSITORIES"
          exit "$failed"
