name: Sync managed forks

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-fork-sync
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'cla7aye15I4nd/opensource-manager' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.find.outputs.batches }}
      count: ${{ steps.find.outputs.count }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/workflows .github/tests
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/sync.yml?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > .github/workflows/sync.yml
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/tests/sync.sh?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > .github/tests/sync.sh
          bash .github/tests/sync.sh
      - name: Find public open-source forks
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api --paginate "users/$OWNER/repos?per_page=100&type=owner&sort=full_name" \
            --jq '.[] | select(.fork and (.private | not) and (.name | startswith("opensource-"))) | .name' > forks.txt
          jq -sc '
            [range(0; length; 400) as $i | .[$i:$i+400]
             | {repositories:join("\n")}]
          ' < <(jq -R . forks.txt) > batches.json
          echo "batches=$(cat batches.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -Rn '[inputs]|length' < forks.txt)" >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    if: needs.discover.outputs.count != '0'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.batches) }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repositories }}
          permission-contents: write
          permission-workflows: write
          permission-administration: write

      - name: Disable fork Actions and sync upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORIES: ${{ matrix.repositories }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh_retry() {
            local attempt output status message delay error_file
            error_file="$(mktemp)"
            for attempt in 1 2 3; do
              if output="$(gh "$@" 2> "$error_file")"; then
                printf '%s\n' "$output"
                rm "$error_file"
                return 0
              else
                status=$?
              fi
              message="$(cat "$error_file")"
              printf '%s\n' "$message" >&2
              case "$message" in
                *"HTTP 429"*|*"secondary rate limit"*|*"abuse detection"*) delay=60 ;;
                *"HTTP 500"*|*"HTTP 502"*|*"HTTP 503"*|*"HTTP 504"*) delay=$((attempt * 2)) ;;
                *) break ;;
              esac
              [[ "$attempt" == 3 ]] && break
              sleep "$delay"
            done
            rm "$error_file"
            return "$status"
          }
          sync_fork() {
            local repo="$1" item full_name branch enabled attempt branch_sha upstream_sha branch_ref
            full_name="$OWNER/$repo"
            if ! enabled="$(gh_retry api "repos/$full_name/actions/permissions" --jq '.enabled')"; then
              echo "::error::Could not read Actions settings for $full_name; skipping sync"
              return 1
            fi
            if [[ "$enabled" == "true" ]]; then
              echo "Disabling Actions for $full_name"
              if ! gh_retry api --method PUT "repos/$full_name/actions/permissions" -F enabled=false; then
                echo "::error::Could not disable Actions for $full_name; skipping sync"
                return 1
              fi
              for attempt in 1 2 3 4 5; do
                enabled="$(gh_retry api "repos/$full_name/actions/permissions" --jq '.enabled')" || enabled=unknown
                [[ "$enabled" == false ]] && break
                sleep "$attempt"
              done
            fi
            if [[ "$enabled" != "false" ]]; then
              echo "::error::Actions are not confirmed disabled for $full_name; skipping sync"
              return 1
            fi
            echo "Actions are disabled for $full_name"
            if ! item="$(gh_retry api graphql -F owner="$OWNER" -F name="$repo" -f query='
              query($owner:String!,$name:String!) {
                repository(owner:$owner,name:$name) {
                  defaultBranchRef { name target { oid } }
                  parent { defaultBranchRef { name target { oid } } }
                }
              }' --jq '
                .data.repository
                | {branch:.parent.defaultBranchRef.name, upstreamSha:.parent.defaultBranchRef.target.oid,
                   forkBranch:.defaultBranchRef.name, forkSha:.defaultBranchRef.target.oid}
              ')"; then
              echo "::error::Could not read branch heads for $full_name"
              return 1
            fi
            if ! branch="$(jq -er '.branch' <<< "$item")"; then
              echo "::error::No upstream default branch for $full_name"
              return 1
            fi
            if jq -e '.forkBranch == .branch and .forkSha != null and .forkSha == .upstreamSha' <<< "$item" > /dev/null; then
              echo "Already up to date: $full_name ($branch)"
              return 0
            fi
            if [[ "$(jq -r '.forkBranch' <<< "$item")" != "$branch" ]]; then
              branch_ref="$(gh_retry api graphql -F owner="$OWNER" -F name="$repo" -F ref="refs/heads/$branch" -f query='
                query($owner:String!,$name:String!,$ref:String!) {
                  repository(owner:$owner,name:$name) { ref(qualifiedName:$ref) { target { oid } } }
                }' --jq '{sha:.data.repository.ref.target.oid}')" || return 1
              branch_sha="$(jq -r '.sha // empty' <<< "$branch_ref")"
              upstream_sha="$(jq -er '.upstreamSha' <<< "$item")" || return 1
              if [[ "$branch_sha" == "$upstream_sha" ]]; then
                echo "Already up to date: $full_name ($branch)"
                return 0
              fi
              if [[ -z "$branch_sha" ]]; then
                gh api --method POST "repos/$full_name/git/refs" -f "ref=refs/heads/$branch" -f "sha=$upstream_sha" > /dev/null || return 1
                echo "Created upstream branch: $full_name ($branch)"
                return 0
              fi
            fi
            echo "Syncing $repo"
            gh_retry repo sync "$full_name" --branch "$branch" --force
          }
          export -f gh_retry sync_fork
          printf '%s\n' "$REPOSITORIES" | xargs -P 2 -n 1 bash -e -c 'sync_fork "$1"' _
